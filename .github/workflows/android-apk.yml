name: Super Quina Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-apk-public
      - feature/cashier-apk-from-public
    paths:
      - '.github/workflows/android-apk.yml'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'prisma/**'
      - 'prisma.config.ts'
      - 'www/**'

permissions:
  contents: read

concurrency:
  group: super-quina-public-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install project dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/super_quina_ci

      - name: TypeScript type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Verify persistent Capacitor Android project
        run: |
          test -f android/gradlew
          test -f android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Build public Android debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: super-quina-cashier-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
