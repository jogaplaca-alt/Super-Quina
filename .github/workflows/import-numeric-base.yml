name: Import approved numeric game base

on:
  push:
    branches:
      - setup/super-quina

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Super Quina
        uses: actions/checkout@v4
        with:
          ref: setup/super-quina

      - name: Check out approved numeric source
        uses: actions/checkout@v4
        with:
          repository: jpveiculos/JogaPlacas
          ref: 40150c49ffea0497dd6ee00f5dfe25a7452a6ddb
          path: _numeric_source
          persist-credentials: false

      - name: Import source files
        shell: bash
        run: |
          rsync -a --exclude='.git' _numeric_source/ ./
          rm -rf _numeric_source
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to import."
            exit 0
          fi
          git commit -m "Import approved numeric game base for Super Quina"
          git push origin HEAD:setup/super-quina
