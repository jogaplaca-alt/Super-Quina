name: Validate Super Quina

on:
  push:
    branches:
      - setup/super-quina
  pull_request:
    branches:
      - main
      - setup/super-quina

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: superquina
          POSTGRES_PASSWORD: superquina
          POSTGRES_DB: superquina_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U superquina -d superquina_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://superquina:superquina@localhost:5432/superquina_test?schema=public
      RUN_POSTGRES_INTEGRATION: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Apply migrations to an empty PostgreSQL database
        run: npm run db:deploy

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: PostgreSQL integration tests
        run: npm run test:postgres

      - name: Production build
        run: npm run build
