name: Build Printer Super Sena

on:
  workflow_dispatch:
  push:
    paths:
      - 'Printer-Super-Sena/Printer-Super-Sena-Android/**'
      - '.github/workflows/printer-super-sena-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4

      - name: Verify clean Android project
        run: |
          test -f "Printer-Super-Sena/Printer-Super-Sena-Android/settings.gradle"
          test -f "Printer-Super-Sena/Printer-Super-Sena-Android/build.gradle"
          test -f "Printer-Super-Sena/Printer-Super-Sena-Android/app/build.gradle"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile debug APK
        run: gradle --no-daemon -p Printer-Super-Sena/Printer-Super-Sena-Android :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Printer-Super-Sena-debug
          path: Printer-Super-Sena/Printer-Super-Sena-Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
