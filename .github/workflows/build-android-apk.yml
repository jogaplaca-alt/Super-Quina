name: Build Super Quina APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-integrated-printer-app
    paths:
      - '.github/workflows/build-android-apk.yml'
      - 'android-branding/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'plugins/rawbt-printer/**'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Prepare Capacitor web directory
        run: |
          mkdir -p www
          if [ ! -f www/index.html ]; then
            printf '<!doctype html><html><head><meta charset="utf-8"></head><body></body></html>' > www/index.html
          fi

      - name: Generate Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Apply Android branding resources
        run: |
          if [ -d android-branding/res ]; then
            mkdir -p android/app/src/main/res
            cp -R android-branding/res/. android/app/src/main/res/
          fi
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/superquina_splash.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item><color android:color="#061B8F" /></item>
          </layer-list>
          EOF

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: super-quina-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
