name: Build Superquina Print Bridge APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/superquina-bluetooth-printer
    paths:
      - "superquina-print-bridge/**"
      - ".github/workflows/superquina-print-bridge.yml"

permissions:
  contents: read

jobs:
  build-android:
    name: Compile Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: superquina-print-bridge

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compile debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: superquina-print-bridge-debug
          path: superquina-print-bridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
